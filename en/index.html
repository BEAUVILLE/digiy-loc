<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0;url=/?lang=en">
  <meta name="robots" content="noindex,follow">
  <title>DIGIY LOC — English</title>
</head>
<body>
  <p>Opening DIGIY LOC in English…</p>
  <script>
    (() => {
      const lang = "en";
      try {
        localStorage.setItem("digiyLocLang", lang);
        localStorage.setItem("digiy-lang", lang);
      } catch (_) {}
      const target = new URL("/", location.origin);
      target.searchParams.set("lang", lang);
      new URLSearchParams(location.search).forEach((value, key) => {
        if (key !== "lang") target.searchParams.set(key, value);
      });
      location.replace(target.pathname + target.search + target.hash);
    })();
  </script>
  <p><a href="/?lang=en">Open DIGIY LOC</a></p>
</body>
</html>
