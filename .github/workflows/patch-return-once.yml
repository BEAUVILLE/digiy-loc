name: DIGIY LOC return button one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-return-once.yml'

permissions:
  contents: write

jobs:
  patch-return:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strengthen DIGIYLYFE.COM return
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_top = '    <a href="https://digiylyfe.com/?lang=fr" target="_blank">🌍 DIGIYLYFE</a>'
          new_top = '    <a href="https://digiylyfe.com/" style="flex:1 1 100%;min-height:52px;display:flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border:2px solid #d8ad46;border-radius:999px;background:#fffefa;color:#073f32;text-decoration:none;font-size:15px;font-weight:950;letter-spacing:.02em;box-shadow:0 8px 20px rgba(0,0,0,.20)">← RETOUR DIGIYLYFE.COM</a>'

          if old_top not in s:
              raise SystemExit('Top DIGIYLYFE return link not found; aborting without changes.')
          s = s.replace(old_top, new_top, 1)

          old_bottom = '  <a href="https://digiylyfe.com/" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 15px;border-radius:999px;text-decoration:none;font:900 14px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;border:1px solid rgba(127,127,127,.28);background:rgba(255,255,255,.08);color:inherit">🏠 Retour à l’accueil DIGIYLYFE</a>'
          new_bottom = '  <a href="https://digiylyfe.com/" style="width:100%;max-width:520px;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:11px 18px;border-radius:999px;text-decoration:none;font:950 15px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;border:2px solid #d8ad46;background:#073f32;color:#fff;box-shadow:0 8px 20px rgba(7,63,50,.20)">← RETOUR DIGIYLYFE.COM</a>'
          if old_bottom in s:
              s = s.replace(old_bottom, new_bottom, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit pilot change
        run: |
          git config user.name "DIGIYLYFE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "UI: strengthen DIGIYLYFE.COM return on LOC"
          git push
