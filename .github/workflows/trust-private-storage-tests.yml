name: DIGIY TRUST V14 private storage tests
on:
  pull_request:
    paths:
      - "trust/**"
      - ".github/workflows/trust-private-storage-tests.yml"
  push:
    paths:
      - "trust/**"
      - ".github/workflows/trust-private-storage-tests.yml"
jobs:
  storage-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test trust/v14-storage-contract.test.mjs trust/feedback-contract.test.mjs trust/private-intake-boundary.test.mjs
