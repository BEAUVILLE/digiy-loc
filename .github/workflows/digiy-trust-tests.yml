name: DIGIY TRUST eligibility tests
on:
  pull_request:
    paths:
      - 'trust/**'
      - '.github/workflows/digiy-trust-tests.yml'
  push:
    paths:
      - 'trust/**'
      - '.github/workflows/digiy-trust-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test trust/*.test.mjs
