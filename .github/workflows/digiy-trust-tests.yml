name: DIGIY TRUST eligibility tests
on:
  pull_request:
    paths:
      - 'trust/**'
      - '.github/workflows/digiy-trust-tests.yml'
  push:
    paths:
      - 'trust/**'
      - '.github/workflows/digiy-trust-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test trust/*.test.mjs
  sql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: trust_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute SQL integration tests (ephemeral database)
        env:
          PGPASSWORD: trust_test_only
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f trust/sql/integration_test.psql
