name: Apply Sarlat card signature once
on:
  push:
    paths:
      - '.github/workflows/apply-sarlat-card-signature-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire shared DIGIY card into LOC
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="https://digiylyfe.com/assets/digiy-sarlat-baptiste-signature-v1.js?v=20260828-v1" defer></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('body marker missing')
              s=s.replace('</body>',tag+'\n</body>',1)
          s=s.replace('https://sarlat-chez-baptiste.digiylyfe.com/CARTE%20SARLAT%20BAPTISTE.png','https://digiylyfe.net/wp-content/uploads/2026/07/F9595D25-B9F1-4049-95CD-00554BC8F369.png',1)
          assert 'CHEZ BAPTISTE · SARLAT' in s
          assert '78 € / nuit' in s
          assert 'https://sarlat-chez-baptiste.digiylyfe.com/' in s
          assert 'https://wa.me/33638329423' in s
          assert 'À PARTIR DE 28 000 FCFA / mois' in s
          assert '← RETOUR DIGIYLYFE.COM' in s
          assert 'CHEZ BAPTISTE · SALY JOSEPH' in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit validated LOC signature
        shell: bash
        run: |
          git config user.name "DIGIYLYFE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-sarlat-card-signature-once.yml
          git add index.html
          git diff --cached --quiet || git commit -m "UI: align Chez Baptiste Sarlat card in LOC"
          git push origin HEAD:main
