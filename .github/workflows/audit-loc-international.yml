name: Audit LOC international

on:
  push:
    branches:
      - feature/loc-international-complet-v1
    paths:
      - "**/*.html"
      - "tools/audit_loc_i18n.py"
      - ".github/workflows/audit-loc-international.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/loc-international-complet-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inventorier toutes les pages LOC
        run: python3 tools/audit_loc_i18n.py

      - name: Publier l’inventaire sur la branche
        run: |
          if git diff --quiet -- loc-i18n-inventory.json loc-i18n-audit.md; then
            echo "Inventaire inchangé"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loc-i18n-inventory.json loc-i18n-audit.md
          git commit -m "LOC : mettre à jour l’inventaire international complet"
          git push origin HEAD:feature/loc-international-complet-v1

# Deuxième push volontaire : le workflow existe désormais avant son déclenchement.
