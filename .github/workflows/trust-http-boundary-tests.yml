name: DIGIY TRUST V20 HTTP boundary tests
on:
  push:
    paths: ["trust/**", ".github/workflows/trust-http-boundary-tests.yml"]
  pull_request:
    paths: ["trust/**", ".github/workflows/trust-http-boundary-tests.yml"]
jobs:
  http-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test trust/http-boundary.test.mjs trust/integration-pilot.test.mjs
