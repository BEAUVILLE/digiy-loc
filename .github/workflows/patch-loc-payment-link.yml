name: Patch LOC payment button link

on:
  push:
    paths:
      - .github/workflows/patch-loc-payment-link.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route activation button to payment page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('inscription-loc.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('id="btnPay">🚀 Préparer paiement</button>', 'id="btnPay">💳 Aller au paiement</button>')
          s = s.replace('id="btnFloatingPay">🚀 Voir le total et activer</button>', 'id="btnFloatingPay">💳 Payer / activer LOC</button>')

          old_func = 'function openWhatsApp(msg){location.href=`https://wa.me/${SUPPORT_WA}?text=${encodeURIComponent(msg)}`} '
          new_func = 'function openWhatsApp(msg){location.href=`https://wa.me/${SUPPORT_WA}?text=${encodeURIComponent(msg)}`}function buildPaymentUrl(){const t=total();const params=new URLSearchParams();params.set("module","LOC");params.set("source","inscription-loc");if(state.base){params.set("code",state.base.code);params.set("plan",state.base.name);params.set("base",String(t.base));}if(state.boost){params.set("boost",state.boost.code);params.set("boost_label",state.boost.name);params.set("boost_amount",String(t.boost));}if(state.reseau){params.set("reseau",state.reseau.code);params.set("reseau_label",state.reseau.name);params.set("reseau_amount",String(t.reseau));}params.set("extras",String(t.extras));params.set("total",String(t.total));return "https://commencer-a-payer.digiylyfe.com/?"+params.toString()}function goPayment(){if(!state.base){$("locOptions").scrollIntoView({behavior:"smooth",block:"start"});return}location.href=buildPaymentUrl()} '
          if old_func in s:
              s = s.replace(old_func, new_func, 1)
          elif 'function buildPaymentUrl()' not in s:
              s = s.replace('function openWhatsApp(msg){location.href=`https://wa.me/${SUPPORT_WA}?text=${encodeURIComponent(msg)}`}', new_func.strip(), 1)

          s = s.replace('$("btnPay").addEventListener("click",()=>openWhatsApp(buildMessage()));', '$("btnPay").addEventListener("click",goPayment);')
          s = s.replace('$("btnFloatingPay").addEventListener("click",()=>{if(!state.base){$("locOptions").scrollIntoView({behavior:"smooth",block:"start"});return}$("summaryCard").scrollIntoView({behavior:"smooth",block:"start"})});', '$("btnFloatingPay").addEventListener("click",goPayment);')

          p.write_text(s, encoding='utf-8')

          wf = Path('.github/workflows/patch-loc-payment-link.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "DIGIY Auto Patch"
          git config user.email "actions@github.com"
          git add inscription-loc.html .github/workflows/patch-loc-payment-link.yml
          git commit -m "Route LOC activation to payment page" || echo "Nothing to commit"
          git push
