name: Patch LOC public inscription button

on:
  push:
    paths:
      - .github/workflows/patch-loc-inscription-button.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add inscription propriétaire button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''

    /* DIGIY LOC — bouton flottant inscription propriétaire */
    .digiy-loc-owner-float{
      position:fixed;
      left:12px;
      right:12px;
      bottom:calc(14px + env(safe-area-inset-bottom,0px));
      z-index:9999;
      max-width:520px;
      margin:0 auto;
      min-height:68px;
      border-radius:22px;
      border:1px solid rgba(238,200,126,.78);
      background:linear-gradient(135deg,#ffdc9a,#eec87e);
      color:#102132;
      box-shadow:0 18px 42px rgba(0,0,0,.34),0 0 0 6px rgba(238,200,126,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:10px 18px;
      text-decoration:none;
      font-weight:1000;
      text-align:left;
    }
    .digiy-loc-owner-float .ico{font-size:26px;line-height:1;flex:0 0 auto}
    .digiy-loc-owner-float strong{display:block;font-size:17px;line-height:1.05;color:#102132}
    .digiy-loc-owner-float small{display:block;margin-top:3px;font-size:13px;line-height:1.12;font-weight:1000;color:rgba(16,33,50,.82)}
    .digiy-loc-owner-float:active{transform:translateY(1px) scale(.995)}
    @media(min-width:760px){.digiy-loc-owner-float{left:auto;right:22px;width:360px}}
'''
          html = r'''

  <!-- DIGIY LOC — porte propriétaire séparée de la recherche client -->
  <a class="digiy-loc-owner-float" href="./inscription-loc.html" aria-label="Je loue un logement, m'inscrire sur DIGIY LOC">
    <span class="ico">🏠</span>
    <span><strong>Je loue un logement</strong><small>M’inscrire sur DIGIY LOC</small></span>
  </a>
'''

          if 'digiy-loc-owner-float' not in s:
              s = s.replace('</style>', css + '\n  </style>', 1)
              s = s.replace('</body>', html + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('LOC inscription button added.')
          else:
              print('LOC inscription button already present.')

          wf = Path('.github/workflows/patch-loc-inscription-button.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "DIGIY Auto Patch"
          git config user.email "actions@github.com"
          git add index.html .github/workflows/patch-loc-inscription-button.yml
          git commit -m "Add LOC owner inscription button" || echo "Nothing to commit"
          git push
